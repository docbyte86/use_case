name: CI/CD Automation Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Linter / Syntax-Check
        run: |
          pip install flake8
          flake8 main.py --max-line-length=120 || true
          python -m py_compile main.py

      - name: Docker-Image bauen
        run: docker build -t healthcheck:latest .

      - name: Simulierter Deployment-Step
        run: echo "Deployment ausgelöst – Service healthcheck:latest würde jetzt ausgerollt."

      - name: Benachrichtigung per Webhook
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          STATUS=$(python main.py | python -c "import sys, json; print(json.load(sys.stdin)['status'])")
          echo "Status: $STATUS"
          if [ -n "$WEBHOOK_URL" ]; then
            curl -X POST -H "Content-Type: application/json" \
              -d "{\"text\": \"Health-Check Status: $STATUS\"}" \
              "$WEBHOOK_URL"
          else
            echo "Kein WEBHOOK_URL-Secret gesetzt – Benachrichtigung wird simuliert: Status $STATUS"
          fi
